<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud-Based Student Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h2 { color: #333; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn { display: inline-block; width: 100%; padding: 12px 0; background: #007BFF; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; box-sizing: border-box; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Cloud-Based Student Attendance System</h2>
        <p>Welcome to our capstone project!</p>
        <a href="/login" class="btn">Go to Login</a>
    </div>
</body>
</html>
