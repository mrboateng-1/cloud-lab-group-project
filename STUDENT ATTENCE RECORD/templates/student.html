<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; }
        .logout { float: right; background: #dc3545; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; }
        .metrics { display: flex; gap: 15px; margin-top: 20px; }
        .card { flex: 1; background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; text-align: center; }
        .card h3 { margin: 0; color: #007BFF; font-size: 22px; }
        .card p { margin: 5px 0 0 0; color: #555; font-size: 14px; }
        table { width: 100%; margin-top: 25px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/logout" class="logout">Logout</a>
        <h2>Student Dashboard</h2>
        <p>Welcome, <strong>{{ name }}</strong> (Student)</p>

        <div class="metrics">
            <div class="card">
                <h3>{{ total }}</h3>
                <p>Total Classes Recorded</p>
            </div>
            <div class="card">
                <h3>{{ present }}</h3>
                <p>Classes Attended</p>
            </div>
            <div class="card">
                <h3>{{ percentage }}%</h3>
                <p>Attendance Rate</p>
            </div>
        </div>

        <h3>Your Attendance Records</h3>
        <table>
            <tr>
                <th>Course</th>
                <th>Date</th>
                <th>Status</th>
            </tr>
            {% for rec in records %}
            <tr>
                <td>{{ rec.course }}</td>
                <td>{{ rec.date }}</td>
                <td>{{ rec.status }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
